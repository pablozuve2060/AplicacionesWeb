<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de Consulta</title>
    <link rel="stylesheet" href="css/detalles.css">
    <link rel="stylesheet" href="css/pantallas.css">

</head>

<body>
    <header class="cabecera">
        <div class="sistema">
            <span class="sistema-nombre">Historias Clínicas</span>
            <span class="sistema-sub">Policlínico ULEAM</span>
        </div>
    </header>

    <div class="detalle">
        <h1>Detalle de consulta</h1>

        <p class="paciente-datos">
            <span><strong>Paciente:</strong> <span id="det-paciente"></span></span>
            <span><strong>Cédula:</strong> <span id="det-cedula"></span></span>
        </p>

        <dl>
            <dt>Fecha:</dt>
            <dd id="det-fecha"></dd>

            <dt>Médico/a:</dt>
            <dd id="det-medico"></dd>

            <dt>Motivo:</dt>
            <dd id="det-motivo"></dd>

            <dt>Diagnóstico:</dt>
            <dd id="det-diagnostico"></dd>

            <dt>Tratamiento:</dt>
            <dd id="det-tratamiento"></dd>

            <dt>Observaciones:</dt>
            <dd id="det-observaciones"></dd>
        </dl>
        <div class="botones">
            <button class="button1" type="button" onclick="irCon('historial.html')"><b>Volver</b></button>

            <button class="button2" type="submit"><b>Exportar PDF</b></button>
        </div>

        <script src="java/pantallas.js"></script>
        <script src="java/datosprueba.js"></script>

    </div>
</body>
